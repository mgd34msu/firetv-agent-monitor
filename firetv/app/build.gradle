plugins {
    id "com.android.application"
}

// The TV screen is the webOS app's web code, shared as is: copied from
// ../webos/app at build time. The server address and token are not built in:
// setup.sh sends them to the installed app (see MainActivity).
def webAssets = layout.buildDirectory.dir("webassets")
def copyWeb = tasks.register("copyWeb", Sync) {
    from("../../webos/app") {
        include "*.html", "*.js", "*.css"
        exclude "config.js"
    }
    into webAssets
}

android {
    namespace "org.agentmonitor.firetv"
    compileSdk 35

    defaultConfig {
        applicationId "org.agentmonitor.firetv"
        minSdk 22
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    sourceSets {
        main.assets.srcDirs += webAssets
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // sideloaded, never published to a store
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.named("preBuild") { dependsOn copyWeb }
